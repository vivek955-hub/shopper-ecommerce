# Starts the whole app:  docker compose up --build
# Then open http://localhost:3000   (API: http://localhost:8080/api/products)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopper_db
      MYSQL_USER: shopper
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopper_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./ecom-project
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopper_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: shopper
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-shopper_pass}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./ecom-frontend-5-main
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mysql_data:
