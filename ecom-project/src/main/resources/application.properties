spring.application.name=ecom-project
server.port=${PORT:8080}

# --- Database -------------------------------------------------------------
# Default: in-memory H2 so the project runs with zero setup.
# For MySQL (Docker / production) override with environment variables:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:h2:mem:shopper;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Uploads --------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- App settings ---------------------------------------------------------
# Comma-separated list of browser origins allowed to call the API
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# Insert a few demo products on startup when the table is empty
app.seed.enabled=false

# --- Actuator (health check only) ----------------------------------------
management.endpoints.web.exposure.include=health
